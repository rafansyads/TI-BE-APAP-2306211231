spring:
  application:
    name: accommodation-2306211231-be

  app:
    jwt:
      secret-key: ${JWT_SECRET_KEY}
      expiration-ms: 86400000 # 1 day in milliseconds

  mvc:
    hiddenmethod:
      filter:
        enabled: true

  profiles:
    active: 'prod'
    # active: 'dev'
    # active: 'test'

  jpa:
    hibernate:
      ddl-auto: create-drop

    # Uncomment if you want SQL logging (previously added during debugging)
    # show-sql: true
    # properties:
    #   hibernate:
    #     format_sql: true

  main:
    allow-circular-references: true

server:
  port: ${SERVER_PORT_1:8080}
  servlet:
    context-path: /api
