spring:
  config:
    import: optional:file:./.env[.properties]
  datasource:
    url: ${DATABASE_URL_DEV}
    username: ${DEV_USERNAME}
    password: ${DEV_PASSWORD}

# Optional external backend service base URLs (modular)
# Define as:
# backend:
#   services:
#     backend2: https://example.com/backend2
#     user: https://example.com/user
#     (insecure) backend3: http://example.com/backend3
# If omitted, related WebClients are still created without a baseUrl or skipped from the map.

backend:
  services: {}